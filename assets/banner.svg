<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 {
        animation: float 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pipeline-line {
        stroke-dasharray: 6 6;
        animation: dash 2.5s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" />
  </g>

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="260" r="180" fill="#818cf8" opacity="0.1" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="120" fill="#c084fc" opacity="0.06" filter="url(#glow)"/>

  <!-- Left Content: Title & Badges -->
  <g transform="translate(80, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="5" fill="#10b981" class="pulse-node"/>
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED RECRUITING TECH</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      <tspan fill="#f8fafc">Awesome </tspan>
      <tspan fill="url(#accentGrad)">Recruiting ATS</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Platforms, Open-Source Trackers &amp; Talent Automation
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ 35+ SaaS</text>
      <text x="80" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Platforms</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="155" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="169" y="24" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⭐ Open Source</text>
      <text x="272" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ranked</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="150" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="334" y="24" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">💰 Transparent</text>
      <text x="430" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Pricing</text>
    </g>
  </g>

  <!-- Right Visual: Interactive Dynamic ATS Pipeline Diagram -->
  <g transform="translate(680, 50)">
    <!-- Connecting animated pipeline paths -->
    <path d="M 120 70 L 260 70 L 260 160 L 380 160" fill="none" stroke="#38bdf8" stroke-width="2" class="pipeline-line" opacity="0.6"/>
    <path d="M 120 220 L 260 220 L 260 160" fill="none" stroke="#818cf8" stroke-width="2" class="pipeline-line" opacity="0.6"/>

    <!-- Floating Candidate Card 1 (Sourced / Screening) -->
    <g class="floating-card-1" transform="translate(20, 30)" filter="url(#cardShadow)">
      <rect width="180" height="80" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="28" y="33" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14">👤</text>
      <text x="52" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Candidate Inflow</text>
      <text x="52" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AI Resume Match 98%</text>
      <!-- Progress Bar -->
      <rect x="20" y="56" width="140" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="56" width="110" height="6" rx="3" fill="#38bdf8"/>
    </g>

    <!-- Floating Stage Node (Interview Stage) -->
    <g class="floating-card-2" transform="translate(250, 120)" filter="url(#cardShadow)">
      <rect width="190" height="88" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="28" cy="30" r="14" fill="#818cf8" fill-opacity="0.2"/>
      <text x="28" y="35" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="14">🎯</text>
      <text x="52" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Structured Interview</text>
      <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Scorecards &amp; Calibration</text>
      <rect x="20" y="60" width="60" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="50" y="73" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">✓ PASSED</text>
    </g>

    <!-- Floating Output Card (Offer / Hired) -->
    <g class="floating-card-1" transform="translate(60, 185)" filter="url(#cardShadow)">
      <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="12" fill="#10b981" fill-opacity="0.2"/>
      <text x="26" y="30" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12">🚀</text>
      <text x="48" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Offer Accepted</text>
      <text x="48" y="40" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Automated Onboarding</text>
      <circle cx="145" cy="54" r="4" fill="#10b981" class="pulse-node"/>
      <text x="135" y="57" text-anchor="end" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">Active Sync</text>
    </g>
  </g>
</svg>
